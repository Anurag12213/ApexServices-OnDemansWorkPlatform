# ===============================================================
# ApexServices Production Nginx HTTPS & Reverse Proxy Configuration
# ===============================================================

# 1. Automatic HTTP to HTTPS 301 Permanent Redirect
server {
    listen 80;
    listen [::]:80;
    server_name apexservices.com www.apexservices.com;

    # Certbot challenge verification path (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all non-SSL traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Canonical www to apex redirect (Optional: ensures single canonical domain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.apexservices.com;

    ssl_certificate /etc/letsencrypt/live/apexservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexservices.com/privkey.pem;

    return 301 https://apexservices.com$request_uri;
}

# 3. Primary Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apexservices.com;

    # SSL / TLS Modern Security Protocol Settings
    ssl_certificate /etc/letsencrypt/live/apexservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexservices.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS) - 1 Year with Subdomains & Preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Essential Defense Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # Frontend Single Page Application (SPA) Root
    root /var/www/apexservices/customer/dist;
    index index.html;

    # Customer Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot REST API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;

        # Forward Original Client & HTTPS Headers to Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts & Buffer configurations
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket Real-Time Dispatch Proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Uploaded media assets caching
    location /uploads/ {
        alias /var/www/apexservices/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
