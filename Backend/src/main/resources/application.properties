spring.application.name=ApexServicesBackend
server.port=${SERVER_PORT:8080}

# ==========================================
# HTTPS & Reverse Proxy Forward Headers
# Detects SSL termination from Cloudflare, Nginx, or AWS load balancers
# ==========================================
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# ==========================================
# External Environment (.env) Configuration
# Imports .env from working directory or project root
# ==========================================
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ==========================================
# Database Configuration (Environment-Driven)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:apex_services}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# Flyway Database Migration Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ==========================================
# CORS Security Configuration (Environment-Driven)
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,https://apexservices.com,https://www.apexservices.com}

# ==========================================
# Actuator Security & Monitoring
# ==========================================
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info,metrics}
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ==========================================
# JWT Security & Token Signing (Environment-Driven)
# ==========================================
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Completion Verification OTP Security (Environment-Driven)
# ==========================================
security.otp.secret=${OTP_SECRET:ApexServicesAuthoritativeOtpSecretKey9876543210}

# ==========================================
# OAuth2 / Identity Providers (Environment-Driven)
# ==========================================
security.google.client-id=${GOOGLE_CLIENT_ID:}
security.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ==========================================
# Initial Seed User Passwords (Environment-Driven)
# ==========================================
security.seed.admin-password=${ADMIN_DEFAULT_PASSWORD:admin123}
security.seed.partner-password=${PARTNER_DEFAULT_PASSWORD:partner123}
security.seed.customer-password=${CUSTOMER_DEFAULT_PASSWORD:customer123}

